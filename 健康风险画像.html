<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f7;--card:#fff;--ink:#14213d;--sub:#5d6b82;--line:#d9e0ea;--in:#4f46e5;--ac:#0d9488;--hi:#dc2626;--mid:#d97706;--lo:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--sub:#9aa8c2;--line:#2b3957;--in:#8b86ff;--ac:#2dd4bf;--hi:#f87171;--mid:#fbbf24;--lo:#4ade80}}
:root[data-theme="dark"]{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--sub:#9aa8c2;--line:#2b3957;--in:#8b86ff;--ac:#2dd4bf;--hi:#f87171;--mid:#fbbf24;--lo:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;margin:8px 0 4px}h2{font-size:17px;margin:0 0 10px}h3{font-size:21px;line-height:1.4;margin:18px 0 6px}
.s{color:var(--sub);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.pg{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 6px}.pg i{display:block;height:100%;background:var(--in);transition:width .25s}
.sec{font-size:13px;color:var(--in);font-weight:600}

.opt.on{border-color:var(--in);background:color-mix(in srgb,var(--in) 12%,var(--card))}
.opt b{width:18px;height:18px;border:2px solid var(--line);border-radius:50%;flex:none}.opt.m b{border-radius:5px}
.opt.on b{background:var(--in);border-color:var(--in)}
.num{display:flex;align-items:center;gap:8px}.num input,textarea{width:100%;font:inherit;font-size:22px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
textarea{font-size:15px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--in);outline-offset:1px}
.nav{display:flex;gap:10px;margin-top:14px}
button.p,button.g{font:inherit;border-radius:10px;padding:12px;flex:1;font-weight:600;cursor:pointer;border:0}
button.p{background:var(--in);color:#fff}button.g{background:transparent;color:var(--sub);border:1px solid var(--line)}
.err{color:var(--hi);font-size:13px;min-height:20px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}.bar i{display:block;height:100%}
.d{border-top:1px solid var(--line);padding:12px 0}.d:first-of-type{border-top:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.adv{font-size:13px;color:var(--sub);margin:6px 0 0}
.fx{font-size:12px;margin:6px 0 0;color:var(--sub)}.fx span{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:0 4px 4px 0}
.note{font-size:12px;color:var(--sub);border-left:3px solid var(--mid);padding-left:10px}
.hide{display:none}
.kv{display:flex;gap:10px;flex-wrap:wrap}.kv div{flex:1;min-width:90px;background:var(--bg);border-radius:10px;padding:8px 10px}
.kv small{display:block;color:var(--sub);font-size:12px}.kv strong{font-size:18px}
.tabs{display:flex;gap:6px;margin:6px 0 14px}.tabs button{flex:1;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}.tabs button.on{background:var(--in);color:#fff;border-color:var(--in)}
.fi{width:100%;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
.red{border-color:var(--hi)}.red li{color:var(--hi)}

<script>
const FREQ=['从不','每月 1 次或更少','每月 2–4 次','每周 2–3 次','每周 4 次及以上'];
const PH=['完全没有','有几天','超过一半的天数','几乎每天'];
const Q=[
{s:'基本信息',k:'age',t:'你的年龄是？',u:'岁',n:[1,110]},
{s:'基本信息',k:'sex',t:'你的生理性别是？',o:['男','女']},
{s:'基本信息',k:'h',t:'你的身高是？',u:'cm',n:[100,230]},
{s:'基本信息',k:'w',t:'你的体重是？',u:'kg',n:[25,250]},
{s:'基本信息',k:'wa',t:'你的腰围是多少？',h:'肚脐水平绕腹一周，放松呼气末测量。不清楚可跳过。',u:'cm',n:[40,200],opt:1},
{s:'基本信息',k:'fe',t:'女性相关情况（可多选）',m:1,ex:3,o:['已绝经','曾有妊娠期糖尿病/妊娠高血压','多囊卵巢综合征','以上都没有'],if:a=>a.sex==1},
{s:'已知指标',k:'bp',t:'最近一次测得的血压？',h:'单位 mmHg，取最近一次体检或家用血压计的结果。',o:['不知道','低于 120/80','120–139 / 80–89','140–159 / 90–99','160/100 及以上']},
{s:'已知指标',k:'glu',t:'最近一次空腹血糖？',h:'单位 mmol/L。',o:['不知道','低于 5.6','5.6–6.9','7.0 及以上']},
{s:'已知指标',k:'lip',t:'最近一次血脂化验结果？',o:['不知道','都在正常范围','甘油三酯偏高','总胆固醇/低密度脂蛋白偏高','两项都偏高']},
{s:'已知指标',k:'dx',t:'医生是否诊断过以下疾病？（可多选）',m:1,ex:11,o:['高血压','糖尿病','血脂异常','冠心病/心肌梗死','脑卒中','脂肪肝','骨质疏松/脆性骨折','慢阻肺/哮喘','慢性肾病','抑郁症/焦虑症','甲状腺疾病','以上都没有']},
{s:'家族史',k:'fam',t:'父母或兄弟姐妹中，有人患过？（可多选）',m:1,ex:9,o:['高血压','糖尿病','心脑血管病','血脂异常','癌症','骨质疏松/髋部骨折','抑郁症/焦虑症','慢性肺病','脂肪肝/肝病','以上都没有/不清楚']},
{s:'家族史',k:'fe2',t:'直系亲属是否早发心脑血管事件？',h:'指父亲或兄弟 55 岁前、母亲或姐妹 65 岁前发生心梗或脑卒中。',o:['否/不清楚','是']},
{s:'吸烟',k:'sm',t:'你的吸烟情况？',o:['从不吸烟','已戒烟超过 1 年','偶尔吸烟','每天少于 10 支','每天 10–20 支','每天 20 支以上']},
{s:'吸烟',k:'smy',t:'累计吸烟多少年？',o:['不到 10 年','10–20 年','20 年以上'],if:a=>a.sm>=1},
{s:'吸烟',k:'dust',t:'是否长期接触二手烟、粉尘、油烟或化学烟雾？',o:['基本没有','偶尔','长期接触（工作或家中）']},
{s:'饮酒',k:'af',t:'你多久喝一次酒？',o:FREQ},
{s:'饮酒',k:'aq',t:'喝酒时一次通常喝多少？',h:'1 个标准杯 ≈ 啤酒 350ml / 红酒 150ml / 白酒 40ml。',o:['1–2 杯','3–4 杯','5–6 杯','7 杯及以上'],if:a=>a.af>0},
{s:'运动',k:'ex',t:'每周中等强度运动总时长？',h:'如快走、骑车、游泳、打球，达到微微出汗、能说话但不能唱歌的程度。',o:['几乎不运动','少于 75 分钟','75–149 分钟','150–299 分钟','300 分钟以上']},
{s:'运动',k:'sit',t:'每天久坐（工作、看屏幕、开车）多长时间？',o:['少于 4 小时','4–8 小时','超过 8 小时']},
{s:'关节与痛风',k:'jt',t:'近半年是否有这些关节/骨骼不适？（可多选）',m:1,ex:5,o:['晨起关节僵硬超过 30 分钟','多个关节反复肿痛','膝/髋/手指关节活动后疼痛','腰背或颈肩长期酸痛','足趾/踝突发剧痛红肿','以上都没有']},
{s:'关节与痛风',k:'ua',t:'最近一次血尿酸？',h:'男性 >420、女性 >360 μmol/L 为偏高。',o:['不知道','在正常范围','偏高']},
{s:'关节与痛风',k:'dx2',t:'医生是否诊断过以下关节/脊柱疾病？（可多选）',m:1,ex:4,o:['痛风/高尿酸血症','骨关节炎','类风湿/强直性脊柱炎','腰椎间盘突出/颈椎病','以上都没有']},
{s:'关节与痛风',k:'fam2',t:'亲属中有人患过？（可多选）',m:1,ex:3,o:['痛风','类风湿/强直性脊柱炎','严重骨关节炎/做过关节置换','以上都没有/不清楚']},
{s:'关节与痛风',k:'jl',t:'你的关节负荷情况？',o:['没有特别情况','长期站立、负重、蹲跪','膝/踝等关节曾受伤或做过手术']},
{s:'关节与痛风',k:'pur',t:'高嘌呤饮食频率？',h:'海鲜、动物内脏、火锅、浓肉汤、啤酒。',o:['很少','每周 1–2 次','每周 3 次以上']},
{s:'睡眠',k:'sl',t:'平均每晚睡多久？',o:['少于 5 小时','5–6 小时','6–7 小时','7–9 小时','超过 9 小时']},
{s:'睡眠',k:'sp',t:'是否有这些睡眠问题？（可多选）',m:1,ex:4,o:['入睡困难','夜间易醒、早醒','打鼾或夜间憋醒','白天明显困倦','没有']},
{s:'饮食',k:'veg',t:'每天吃多少蔬菜水果？',h:'1 份约一个拳头大小。',o:['几乎不吃','1–2 份','3–4 份','5 份及以上']},
{s:'饮食',k:'meat',t:'红肉与加工肉（猪牛羊、香肠、培根）吃得多吗？',o:['很少','每周 1–3 次','每周 4–6 次','几乎每天']},
{s:'饮食',k:'sug',t:'含糖饮料、甜点、奶茶的频率？',o:['几乎不吃','每周 1–2 次','每周 3–6 次','每天都有']},
{s:'饮食',k:'salt',t:'口味与外食情况？',o:['清淡，多在家做饭','适中','偏咸偏油，常点外卖','很重口，几乎天天外食']},
{s:'饮食',k:'fish',t:'鱼类、豆制品、坚果每周吃几次？',o:['几乎不吃','1–2 次','3 次及以上']},
{s:'心理状态',k:'p1',t:'过去两周，是否对做事提不起兴趣或没有乐趣？',h:'PHQ-2 筛查量表',o:PH},
{s:'心理状态',k:'p2',t:'过去两周，是否感到心情低落、沮丧或绝望？',o:PH},
{s:'心理状态',k:'g1',t:'过去两周，是否感到紧张、焦虑或烦躁？',h:'GAD-2 筛查量表',o:PH},
{s:'心理状态',k:'g2',t:'过去两周，是否无法停止或控制担忧？',o:PH},
{s:'心理状态',k:'st',t:'总体来说，你感到的生活/工作压力？',o:['很小','一般','较大','极大']},
{s:'病历',k:'rec',t:'有体检报告或病历吗？（可选）',h:'粘贴文字内容，系统会识别其中的诊断与异常指标。没有可直接生成报告。',txt:1,opt:1}
];
const $=id=>document.getElementById(id),A={};let H=[],cur=0;
const vis=i=>!Q[i].if||Q[i].if(A);
function show(i){cur=i;const q=Q[i],body=$('body');$('err').textContent='';
 const idx=Q.slice(0,i).filter((_,j)=>vis(j)).length,tot=Q.filter((_,j)=>vis(j)).length;
 $('sec').textContent=q.s;$('cnt').textContent=`第 ${idx+1} 题 / 共 ${tot} 题`;$('pg').style.width=idx/tot*100+'%';
 $('t').textContent=q.t;$('hint').textContent=q.h||'';$('bk').style.visibility=H.length?'visible':'hidden';
 $('nx').textContent=i==Q.length-1?'生成报告':'下一题';
 $('nx').style.display=(q.o&&!q.m)?'none':'';
 if(q.o)body.innerHTML=q.o.map((o,j)=>{const on=q.m?(A[q.k]||[]).includes(j):A[q.k]===j;return`<button class="opt ${q.m?'m ':''}${on?'on':''}" data-j="${j}"><b></b>${o}</button>`}).join('');
 else if(q.txt)body.innerHTML=`<textarea id="in" rows="7" placeholder="例如：血压 150/95mmHg，甘油三酯偏高，轻度脂肪肝，空腹血糖 6.4……">${A[q.k]||''}</textarea>`;
 else body.innerHTML=`<div class="num"><input id="in" type="number" inputmode="decimal" value="${A[q.k]??''}"><span>${q.u}</span></div>`+(q.opt?'<div class="nav"><button class="g" id="skip">不清楚，跳过</button></div>':'');
 const sk=$('skip');if(sk)sk.onclick=()=>{delete A[q.k];next()};
 const inp=$('in');if(inp&&!q.txt)inp.focus();
}
$('body').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const q=Q[cur],j=+b.dataset.j;
 if(q.m){let s=A[q.k]||[];if(j==q.ex)s=[j];else{s=s.filter(x=>x!=q.ex);s=s.includes(j)?s.filter(x=>x!=j):[...s,j]}A[q.k]=s;show(cur)}
 else{A[q.k]=j;show(cur);setTimeout(next,180)}};
function next(){const q=Q[cur];
 if(q.m&&!(A[q.k]||[]).length){$('err').textContent='请至少选择一项。';return}
 if(q.n){const v=$('in').value;if(v===''&&!q.opt){$('err').textContent='请填写数值。';return}
  if(v!==''){if(+v<q.n[0]||+v>q.n[1]){$('err').textContent=`请输入 ${q.n[0]}–${q.n[1]} 之间的数值。`;return}A[q.k]=+v}}
 if(q.txt)A[q.k]=$('in').value;
 let n=cur+1;while(n<Q.length&&!vis(n))n++;H.push(cur);
 if(n>=Q.length)return report();show(n)}
$('nx').onclick=next;
$('bk').onclick=()=>{if(H.length)show(H.pop())};

// ---------- 评分 ----------
function calc(a){
 const g=(k,d=0)=>a[k]??d,has=(k,i)=>(a[k]||[]).includes(i);
 const m=g('sex')==0,age=g('age'),ag=age<30?0:age<45?1:age<60?2:age<75?3:4;
 const bmi=g('w')/((g('h')/100)**2),bm=bmi<24?0:bmi<28?1:2,wa=a.wa;
 const ab=wa?(wa>=(m?102:95)?2:wa>=(m?90:85)?1:0):bm;
 const sm=[0,1,2,3,5,7][g('sm')],smy=g('smy'),dust=g('dust');
 const au=g('af')+(g('af')>0?g('aq'):0),alh=au>=(m?4:3)?2:au>=2?1:0;
 const ex=g('ex'),lowEx=ex<=1?2:ex==2?1:0,sit=g('sit'),sl=g('sl'),shortSl=sl<=1?2:sl==2?1:0;
 const snore=has('sp',2),insom=has('sp',0)||has('sp',1);
 const veg=g('veg'),lowVeg=veg<=1?1:0,meat=g('meat'),sug=g('sug'),salt=g('salt'),fish=g('fish'),st=g('st');
 const bp=g('bp'),glu=g('glu'),lip=g('lip'),phq=g('p1')+g('p2'),gad=g('g1')+g('g2');
 const fam=i=>has('fam',i),dx=i=>has('dx',i),fe=i=>has('fe',i),rec=g('rec','');
 const meno=fe(0)||(!m&&age>=50);const jt=i=>has('jt',i),d2=i=>has('dx2',i),f2=i=>has('fam2',i),ua=g('ua'),pur=g('pur'),jl=g('jl');
 const D=[
 {n:'高血压',dx:dx(0),re:/高血压|血压(偏)?高|收缩压|1[4-9]\d\/\d{2,3}/,adv:'每日食盐控制在 5g 以内；家庭自测血压并记录；每周 150 分钟中等强度运动；35 岁后每年至少测一次血压。',
  f:[['i',ag*2,8,'年龄'],['i',fam(0)?6:0,6,'高血压家族史'],['i',m&&age<60?1:0,1,'男性'],['a',bm*3,6,'超重/肥胖'],['a',salt*2,6,'高盐饮食'],['a',alh,2,'饮酒'],['a',lowEx,2,'运动不足'],['a',shortSl+(snore?2:0),4,'睡眠不足/打鼾'],['a',st>=2?2:st,2,'压力'],['a',[0,0,3,6,8][bp],8,'血压偏高']]},
 {n:'2型糖尿病',dx:dx(1),re:/糖尿病|血糖(偏)?高|糖耐量|空腹血糖\s*[6-9]|糖化/,adv:'减少精制主食与含糖饮料；控制腰围；每年查空腹血糖/糖化血红蛋白；已有血糖偏高者建议做 OGTT。',
  f:[['i',[0,0,2,3,4][ag],4,'年龄'],['i',fam(1)?5:0,5,'糖尿病家族史'],['i',fe(1)?3:0,3,'妊娠糖尿病史'],['i',fe(2)?1:0,1,'多囊卵巢'],['a',bm*1.5,3,'BMI 偏高'],['a',ab*2,4,'腹型肥胖'],['a',lowEx,2,'运动不足'],['a',sug,3,'含糖食物'],['a',lowVeg+(meat>=3?1:0),2,'饮食结构'],['a',dx(0)?2:0,2,'已有高血压'],['a',[0,0,5,10][glu],10,'空腹血糖偏高']]},

 <input id="mp" class="fi" type="file" accept="image/*" capture="environment">
 <button class="p" id="ma" style="width:100%;margin-top:10px">上传并分析营养</button><div class="s" id="ms" style="margin-top:8px">图片仅用于本次分析，不会保存。营养值为估算。</div></div>
 <div class="card"><h2>今日摄入（${d.meals.length} 餐）</h2>`+(d.meals.length?d.meals.map((x,i)=>`<div class="d"><div class="top"><strong>${esc(x.type)} · ${esc(x.name)}</strong><button class="g" style="flex:none;padding:2px 10px" data-x="${i}">删除</button></div><div class="s" style="margin:2px 0">${x.kcal} kcal ｜蛋白 ${x.p}g 碳水 ${x.c}g 脂肪 ${x.f}g ｜钠 ${x.na}mg</div><div class="adv">${esc(x.cm||'')}</div></div>`).join('')+bar('热量',t.kcal,T.kcal,'kcal')+bar('膳食纤维',t.fib,25,'g')+bar('添加糖',t.sug,50,'g（上限）')+bar('钠',t.na,2000,'mg（上限）'):'<p class="s">还没有记录，拍一张餐食照片试试。</p>')+`</div>`+tips(t,d,T)+`<div class="card"><h2>提醒</h2><p class="s">下载后导入手机日历，每天 8:00、12:00、18:00 提醒你记录。</p><button class="g" id="ics" style="width:100%">下载每日提醒日历</button><div class="s" id="is"></div></div>`;
 $('tr').innerHTML=h}
$('tr').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const d=day(td());
 if(b.dataset.w){d.water=Math.max(0,d.water+ +b.dataset.w);sv('hr_log',L);renderTr()}
 else if(b.dataset.x!=null){d.meals.splice(+b.dataset.x,1);sv('hr_log',L);renderTr()}
 else if(b.id=='ma')analyze();
 else if(b.id=='ics'){const ev=(h,s)=>`BEGIN:VEVENT\r\nUID:hr${h}@hr\r\nDTSTAMP:20260101T000000Z\r\nDTSTART:20260101T${h}0000\r\nRRULE:FREQ=DAILY\r\nSUMMARY:${s}\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:${s}\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  const data='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//hr//CN\r\n'+ev('08','记录早餐并喝水')+ev('12','记录午餐并喝水')+ev('18','记录晚餐并喝水')+'END:VCALENDAR\r\n';
  try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:'健康记录提醒.ics',data})}catch(x){$('is').textContent='当前环境无法下载，可手动在手机日历中添加每日提醒。'}}};
async function shrink(f){const im=await createImageBitmap(f),s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function analyze(){const f=$('mp').files[0],note=$('mn').value.trim(),st=$('ms');
 if(!f&&!note){st.textContent='请先选择照片，或填写这餐吃了什么。';return}
 let sm;try{sm=await claude.use('sample')}catch(e){}
 if(!sm){st.textContent='当前环境无法使用 AI 识别，请在 claude.ai 中打开此页面。';return}
 st.textContent='正在分析…';
 try{const o={cache:false,modelTier:'quick'},ty=$('mt').value;
  if(f){const lim=await sm.limits();if(!lim.images){st.textContent='当前环境不支持图片识别，可只填文字说明。';return}o.images=[await shrink(f)]}
  const r=await sm.json(`你是营养师。根据${f?'这张餐食照片和':''}用户备注"${note||'无'}"，估算这一餐（${ty}，一人份）的营养。只返回 JSON，不要多余文字：{"name":"菜品名","kcal":数字,"p":蛋白质g,"c":碳水g,"f":脂肪g,"fib":膳食纤维g,"sug":添加糖g,"na":钠mg,"cm":"30字内，指出一个具体可改进点"}。无法识别食物时 kcal 为 0。`,o);
  if(!r||!(r.kcal>0)){st.textContent='没识别出食物，请换更清晰的照片或补充说明。';return}
  const n=v=>Math.round(+v||0);day(td()).meals.push({type:ty,name:String(r.name||'餐食').slice(0,20),kcal:n(r.kcal),p:n(r.p),c:n(r.c),f:n(r.f),fib:n(r.fib),sug:n(r.sug),na:n(r.na),cm:String(r.cm||'').slice(0,60)});
  sv('hr_log',L);renderTr()}catch(e){st.textContent=e&&e.code=='not_granted'?'未授权 AI 识别。':'分析失败，请稍后重试。'}}
function renderTn(){const o=calc(A),ks=Object.keys(L).filter(k=>L[k].meals.length||L[k].water).sort();
 const now=r=>Math.min(95,r.i+Math.max(0,Math.round(r.a+adjOf(r.d.n,'9999'))));
 if(!tsel)tsel=o.res[0].d.n;
 let h=`<div class="card"><h2>风险变化趋势</h2><select id="ds" class="fi" style="margin:0 0 10px">${o.res.map(r=>`<option ${r.d.n==tsel?'selected':''}>${r.d.n}</option>`).join('')}</select>`;
 const r0=o.res.find(r=>r.d.n==tsel);
 if(!ks.length)h+='<p class="s">记录几天后，这里会出现风险变化曲线。每坚持一天，风险指数会慢慢变化，连续 14 天后变化最明显。</p>';
 else{const pts=[r0.t,...ks.map(k=>Math.min(95,r0.i+Math.max(0,Math.round(r0.a+adjOf(tsel,k)))))],lb=['基线',...ks.map(k=>k.slice(5))];
  const mn=Math.min(...pts)-5,mx=Math.max(...pts)+5,X=i=>30+i*(270/Math.max(1,pts.length-1)),Y=v=>140-(v-mn)/(mx-mn)*110;
  h+=`<svg viewBox="0 0 320 170" width="100%"><polyline fill="none" stroke="var(--in)" stroke-width="2.5" points="${pts.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${pts.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--in)"/><text x="${X(i)}" y="${Y(v)-8}" font-size="10" fill="var(--ink)" text-anchor="middle">${v}</text>`).join('')}${pts.map((_,i)=>(pts.length<8||i%Math.ceil(pts.length/6)==0)?`<text x="${X(i)}" y="160" font-size="9" fill="var(--sub)" text-anchor="middle">${lb[i]}</text>`:'').join('')}</svg>`}
 h+=`</div><div class="card"><h2>相比基线</h2>`+o.res.map(r=>{const d=now(r)-r.t;return`<div class="top d"><span>${r.d.n}</span><span class="tag" style="background:${d<0?'var(--lo)':d>0?'var(--hi)':'var(--sub)'}">${r.t} → ${now(r)}</span></div>`}).join('')+`</div>`;
 const rec=ks.slice(-7),av={};rec.forEach(k=>{const f=feats(L[k]);for(const x in f)(av[x]=av[x]||[]).push(f[x])});
 const TX={na:'钠摄入偏高：少汤少酱，外卖选清淡',sug:'添加糖偏多：换成无糖饮品，甜点减量',fib:'膳食纤维不足：每餐加蔬菜，主食搭配全谷物',fat:'脂肪供能比例不理想：少油炸肥肉，增加鱼和豆制品',wat:'饮水不足：分次补水到目标量',kcal:'热量偏离目标：调整主食量，少吃夜宵'};
 const bad=Object.keys(av).filter(x=>av[x].reduce((a,b)=>a+b,0)/av[x].length<0);
 h+=`<div class="card"><h2>近 7 天可改善的点</h2>`+(bad.length?`<ul style="margin:0;padding-left:20px">${bad.map(x=>`<li>${TX[x]}</li>`).join('')}</ul>`:'<p class="s">'+(ks.length?'近期习惯整体良好，继续保持。':'暂无记录。')+'</p>')+'</div>';
 $('tn').innerHTML=h;$('ds').onchange=e=>{tsel=e.target.value;renderTn()}}
const sa=ld('hr_A');if(sa&&sa.age&&sa.h&&sa.w){Object.assign(A,sa);report()}else show(0);
</script></main></body></html>
